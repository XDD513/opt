services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-change-me-token}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
    restart: unless-stopped

  ai-service:
    build:
      context: ../../新建文件夹/ai-service
    ports:
      - "5000:5000"
    restart: unless-stopped

  backend:
    build:
      context: ../hospital-appointment-system
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-prod}
    depends_on:
      - ai-service
      - nacos
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../hospital-frontend
    depends_on:
      - backend
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    restart: unless-stopped
