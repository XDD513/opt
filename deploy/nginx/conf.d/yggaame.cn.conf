# HTTP：保留直连（调试 / 内网）；若希望强制 HTTPS，取消下一段 server 的注释并注释掉本 server 中的重复配置策略见 README
server {
    listen 80;
    server_name 121.43.140.75;

    include /etc/nginx/snippets/locations.conf;
}

# HTTPS（证书挂载：./nginx/ssl → /etc/nginx/ssl，见 deploy/nginx/ssl/README.md）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 121.43.140.75;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/locations.conf;
}
