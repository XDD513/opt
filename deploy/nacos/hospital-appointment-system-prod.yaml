spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:tcm_health_system}?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:change-me-db}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:change-me-redis}
    database: ${REDIS_DB:1}
    timeout: 5000

  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: /

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:change-me-es}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.hospital: info
    com.hospital.mapper: info

aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:change-me}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:change-me}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET_NAME:change-me}
    avatar-path: avatar/
    url-protocol: https

  area:
    api:
      host: https://areasel.market.alicloudapi.com
      path: /v1/area/search
      app-key: ${ALIYUN_AREA_APP_KEY:change-me}
      app-secret: ${ALIYUN_AREA_APP_SECRET:change-me}
      app-code: ${ALIYUN_AREA_APP_CODE:change-me}
      cache-ttl-seconds: 604800

  deepseek:
    api-key: ${DEEPSEEK_API_KEY:change-me}
    api-url: https://api.deepseek.com/v1
    model: deepseek-chat
    max-tokens: 6000
    temperature: 0.5
    cache-ttl-hours: 2

hospital:
  security:
    sensitive-key: ${HOSPITAL_SECURITY_KEY:change-me}
  auth:
    jwt-secret: ${JWT_SECRET:change-me}
    jwt-expiration: 7200000
    jwt-refresh-expiration: 1209600000
    token-ttl-seconds: 7200
  user:
    default-password: 123456
  cors:
    allowed-origins: https://yggaame.cn,https://www.yggaame.cn
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  avatar:
    default-patient: https://api.dicebear.com/7.x/thumbs/svg?seed=patient
    default-doctor: https://api.dicebear.com/7.x/thumbs/svg?seed=doctor
    default-admin: https://api.dicebear.com/7.x/thumbs/svg?seed=admin
    ttl-minutes: 60
  system-settings:
    sync:
      enabled: true
      nacos-group: HOSPITAL_BACKEND
      data-id-pattern: hospital-system-settings-%s.json
