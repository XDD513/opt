# 生产环境配置
spring:
  # 数据源配置（即使 Nacos 配置为空，也能通过环境变量兜底启动）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/tcm_health_system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    druid:
      initial-size: ${SPRING_DATASOURCE_DRUID_INITIAL_SIZE:10}
      min-idle: ${SPRING_DATASOURCE_DRUID_MIN_IDLE:10}
      max-active: ${SPRING_DATASOURCE_DRUID_MAX_ACTIVE:50}
      max-wait: ${SPRING_DATASOURCE_DRUID_MAX_WAIT:60000}

  # Redis配置
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:redis}
    database: ${SPRING_REDIS_DATABASE:0}
    timeout: ${SPRING_REDIS_TIMEOUT:5000}

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# 日志配置
logging:
  level:
    com.hospital: info
    com.hospital.mapper: warn
    org.mybatis: warn
    org.mybatis.spring: warn
  file:
    name: logs/hospital-appointment-system.log
    max-size: 10MB
    max-history: 30

